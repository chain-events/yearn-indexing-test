previewsEnabled: false

databases:
  - name: envio-db
    plan: basic-1gb
    region: virginia
    databaseName: envio_indexer
    user: envio_ix_7f3a
    postgresMajorVersion: "18"

services:
  # Hasura GraphQL Engine - public-facing GraphQL API
  # Benchmark: 1% CPU, 50% memory on starter — no upgrade needed
  - type: web
    name: graphql-engine
    runtime: image
    region: virginia
    image:
      url: hasura/graphql-engine:v2.43.0
    plan: standard
    healthCheckPath: /healthz
    domains:
      - envio-gql.yearn.dev
    envVars:
      - key: HASURA_GRAPHQL_DATABASE_URL
        fromDatabase:
          name: envio-db
          property: connectionString
      - key: HASURA_GRAPHQL_ENABLE_CONSOLE
        value: "true"
      - key: HASURA_GRAPHQL_ENABLED_LOG_TYPES
        value: "startup, http-log, webhook-log, websocket-log, query-log"
      - key: HASURA_GRAPHQL_NO_OF_RETRIES
        value: "10"
      - key: HASURA_GRAPHQL_ADMIN_SECRET
        sync: false
      # Set this in Render as a JSON string that pins every JWT-authenticated
      # request to the readonly Hasura role via claims_map.
      - key: HASURA_GRAPHQL_JWT_SECRET
        sync: false
      - key: HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES
        value: "true"
      - key: PORT
        value: "8080"
      - key: HASURA_GRAPHQL_UNAUTHORIZED_ROLE
        value: "public"

  # Envio Indexer - blockchain event indexer
  # Benchmark: 50% CPU, 86% memory on starter — monitor after adding Katana
  - type: worker
    name: envio-indexer
    runtime: docker
    region: virginia
    plan: standard
    numInstances: 1
    # Build context is the monorepo root so the Dockerfile can read
    # pnpm-workspace.yaml + the root lockfile.
    dockerfilePath: ./apps/indexer/Dockerfile
    envVars:
      - key: ENVIO_API_TOKEN
        sync: false
      - key: ENVIO_DATABASE_URL
        fromDatabase:
          name: envio-db
          property: connectionString
      - key: ENVIO_PG_HOST
        fromDatabase:
          name: envio-db
          property: host
      - key: ENVIO_PG_PORT
        fromDatabase:
          name: envio-db
          property: port
      - key: ENVIO_PG_USER
        fromDatabase:
          name: envio-db
          property: user
      - key: ENVIO_POSTGRES_PASSWORD
        fromDatabase:
          name: envio-db
          property: password
      - key: ENVIO_PG_DATABASE
        fromDatabase:
          name: envio-db
          property: database
      - key: ENVIO_PG_SSL_MODE
        value: "false"
      - key: ENVIO_PG_PUBLIC_SCHEMA
        value: "envio"
      - key: ENVIO_INDEXER_HOST
        value: "0.0.0.0"
      - key: ENVIO_INDEXER_PORT
        value: "9898"
      - key: CONFIG_FILE
        value: "config.yaml"
      - key: LOG_LEVEL
        value: "trace"
      - key: LOG_STRATEGY
        value: "console-pretty"
      - key: HASURA_GRAPHQL_ROLE
        value: "admin"
      - key: HASURA_GRAPHQL_ADMIN_SECRET
        sync: false
      - key: HASURA_SERVICE_HOST
        fromService:
          name: graphql-engine
          type: web
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: HASURA_SERVICE_PORT
        value: "8080"
      - key: ENVIO_THROTTLE_CHAIN_METADATA_INTERVAL_MILLIS
        value: "500"
      - key: ENVIO_THROTTLE_PRUNE_STALE_DATA_INTERVAL_MILLIS
        value: "30000"
      - key: ENVIO_THROTTLE_LIVE_METRICS_BENCHMARK_INTERVAL_MILLIS
        value: "1000"
      - key: ENVIO_THROTTLE_JSON_FILE_BENCHMARK_INTERVAL_MILLIS
        value: "500"
      # A HyperIndex partition can stop advancing while the process continues
      # polling other chains. Exit after a sustained partial stall so Render
      # restarts the one worker from its existing database checkpoint.
      - key: ENVIO_STALL_WATCHDOG_INTERVAL_MILLIS
        value: "60000"
      - key: ENVIO_STALL_WATCHDOG_TIMEOUT_MILLIS
        value: "1800000"
      - key: ENVIO_STALL_WATCHDOG_MIN_BLOCK_LAG
        value: "10000"
      # Start in diagnostic-only mode. Switch to restart after observing stable
      # production diagnostics; restarts only terminate the child process tree.
      - key: ENVIO_STALL_WATCHDOG_MODE
        value: "observe"
      - key: ENVIO_RPC_URL_ETHEREUM
        sync: false
      - key: ENVIO_RPC_URL_OPTIMISM
        sync: false
      - key: ENVIO_RPC_URL_GNOSIS
        sync: false
      - key: ENVIO_RPC_URL_BASE
        sync: false
      - key: ENVIO_RPC_URL_ARBITRUM
        sync: false
      - key: ENVIO_RPC_URL_POLYGON
        sync: false
      - key: ENVIO_RPC_URL_BERACHAIN
        sync: false
      - key: ENVIO_RPC_URL_KATANA
        sync: false
      - key: TUI_OFF
        value: "true"

  # GraphiQL Explorer - authenticated GraphQL IDE for Hasura
  - type: web
    name: graphiql
    runtime: node
    region: virginia
    plan: starter
    rootDir: apps/indexer/graphiql
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /healthz
    domains:
      - envio-explorer.yearn.dev
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "4000"
      - key: HASURA_GRAPHQL_ENDPOINT
        fromService:
          name: graphql-engine
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: HASURA_GRAPHQL_JWT
        sync: false

  # Envio Monitoring - sync-status dashboard for the indexer
  - type: web
    name: envio-monitoring
    runtime: node
    region: virginia
    plan: starter
    # Keep this service on the same repository revision as the indexer. Setting
    # rootDir would prevent indexer-only commits from redeploying the monitor,
    # leaving its displayed Envio version and commit stale.
    autoDeployTrigger: commit
    buildCommand: echo "no build step"
    startCommand: node apps/monitoring/server.js
    # Liveness must not depend on the indexer's data freshness. /healthz is the
    # separate vault-event semantic canary and can intentionally fail while
    # the indexer catches up.
    healthCheckPath: /livez
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "4100"
      # graphql-engine's RENDER_INTERNAL_HOSTNAME resolves to a hostname only; build
      # the full URL below with http://<host>:8080/v1/graphql (hits the internal
      # port so the monitoring service doesn't go through the public domain).
      - key: GRAPHQL_HOST
        fromService:
          name: graphql-engine
          type: web
          envVarKey: RENDER_INTERNAL_HOSTNAME
      # Bearer token for Hasura (signed JWT — shares the key configured in
      # HASURA_GRAPHQL_JWT_SECRET on graphql-engine, which pins requests to the
      # readonly role via claims_map). Sent as `Authorization: Bearer <token>`.
      - key: HASURA_GRAPHQL_JWT
        sync: false
      # Independent chain heads make current readiness authoritative. These
      # are monitoring inputs only; they do not alter Envio's persisted config
      # and cannot trigger a database reset.
      - key: ENVIO_RPC_URL_ETHEREUM
        sync: false
      - key: ENVIO_RPC_URL_OPTIMISM
        sync: false
      - key: ENVIO_RPC_URL_GNOSIS
        sync: false
      - key: ENVIO_RPC_URL_BASE
        sync: false
      - key: ENVIO_RPC_URL_ARBITRUM
        sync: false
      - key: ENVIO_RPC_URL_POLYGON
        sync: false
      - key: ENVIO_RPC_URL_BERACHAIN
        sync: false
      - key: ENVIO_RPC_URL_KATANA
        sync: false
      # Ignore ordinary cursor jitter while still surfacing material stalls.
      # The external one-hour alert remains the slower paging threshold.
      - key: SYNC_BLOCK_TOLERANCE
        value: "100"
      # Path to the indexer project inside the deployed rootDir (relative to apps/monitoring).
      - key: INDEXER_PROJECT_PATH
        value: "../indexer"
